<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; media-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>{{TITLE}} · 聊天记录</title><style>
:root{color-scheme:light;--ink:#172f2b;--muted:#657672;--line:#dae2de;--accent:#136b59}*{box-sizing:border-box}body{margin:0;background:#f4f6f2;color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:980px;margin:auto;padding:45px 28px 70px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:2px}h1{font-size:30px;line-height:1.3;margin:12px 0}header p{margin:8px 0;color:var(--muted)}.badges{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.badge{border:1px solid var(--line);padding:4px 12px;border-radius:20px;background:#fff;font-size:13px}.controls{position:sticky;top:0;z-index:2;display:flex;gap:10px;flex-wrap:wrap;background:#f4f6f2f2;backdrop-filter:blur(12px);padding:14px 0;border-bottom:1px solid var(--line)}input,select,button{padding:10px 12px;border:1px solid #cad7d0;border-radius:8px;background:white;color:var(--ink);font:inherit;font-size:14px}input{flex:1;min-width:180px}select{max-width:240px}button{cursor:pointer}#count{display:block;margin-top:12px;color:var(--muted);font-size:13px}.day{font-size:15px;letter-spacing:1px;margin:30px 0 14px;color:var(--accent)}.message{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 19px;margin:10px 0;scroll-margin-top:95px}.meta{display:flex;align-items:baseline;gap:12px;font-size:13px;margin-bottom:8px}.meta strong{font-size:15px}.meta a{color:var(--muted);text-decoration:none}.number{margin-left:auto;color:#95a29e;font-size:11px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.picture{display:block;margin:14px 0 0}.picture img{display:block;max-width:100%;max-height:720px;object-fit:contain;object-position:left top;border:1px solid var(--line);border-radius:8px}.audio{display:flex;gap:15px;align-items:center;margin-top:12px;flex-wrap:wrap}.audio span,.hint{color:var(--muted);font-size:12px}.hint{display:block;margin-top:8px}.link,.file{display:inline-block;max-width:100%;overflow-wrap:anywhere;padding:7px 11px;border-radius:6px;background:#eaf4ef;color:var(--accent);margin-top:10px;text-decoration:none}.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px;margin-top:30px}[hidden]{display:none!important}@media(max-width:600px){main{padding:26px 14px}h1{font-size:25px}.message{padding:13px}select{max-width:150px}.meta{gap:8px}}@media print{.controls,#count{display:none}main{max-width:none;padding:0}.message{break-inside:avoid}.picture img{max-height:500px}body{background:white}a{color:inherit}.number{color:#666}}
</style></head><body><main><header><div class="eyebrow">WECHAT · LOCAL ARCHIVE</div><h1>{{TITLE}}</h1><p>完整聊天记录 · {{WINDOW}}</p><p>时区：{{TIMEZONE}}，按发送时间正序排列。</p><div class="badges">{{BADGES}}</div></header><div class="controls"><input id="search" type="search" placeholder="搜索消息或发送者" aria-label="搜索消息或发送者"><select id="sender" aria-label="发送者"><option value="">全部发送者</option>{{SENDERS}}</select><select id="date" aria-label="日期"><option value="">全部日期</option>{{DATES}}</select><button id="reset">重置</button><button onclick="window.print()">打印</button></div><span id="count">显示全部 {{COUNT}} 条消息</span>{{WARNINGS}}{{MESSAGES}}<footer class="note">消息正文和可用附件已嵌入，可离线打开。表情消息保留记录，但表情图片未导出；撤回消息仅保留系统提示。JSON 保留查询结果与可读取的原始字段，完整压缩包另含附件原始格式。</footer></main><script>
document.querySelectorAll('.picture').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const link=document.createElement('a');link.href=a.querySelector('img').src;link.download=a.download;link.click()}));const rows=[...document.querySelectorAll('.message')],search=document.getElementById('search'),sender=document.getElementById('sender'),date=document.getElementById('date');function filter(){const q=search.value.trim().toLocaleLowerCase();let n=0;const days=new Set();for(const r of rows){const show=(!q||r.textContent.toLocaleLowerCase().includes(q))&&(!sender.value||r.dataset.sender===sender.value)&&(!date.value||r.dataset.day===date.value);r.hidden=!show;if(show){n++;days.add(r.dataset.day)}}for(const h of document.querySelectorAll('.day'))h.hidden=!days.has(h.id.slice(4));document.getElementById('count').textContent=`显示 ${n} / ${rows.length} 条消息`}search.addEventListener('input',filter);sender.addEventListener('change',filter);date.addEventListener('change',filter);document.getElementById('reset').onclick=()=>{search.value='';sender.value='';date.value='';filter()};
</script></body></html>
